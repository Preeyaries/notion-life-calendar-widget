<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Calendar · Mood & Diary</title>
<style>
:root{--bg:#191919;--panel:#202020;--text:#f4f4f4;--muted:#aaa;--line:#353535;--empty:#292929}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{padding:16px}.app{max-width:1180px;margin:auto}
.header{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;color:#5da0ff;text-transform:uppercase}
h1{margin:3px 0 5px;font-size:24px}.sub{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px}.stat{min-width:80px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.tabs,.nav{display:flex;gap:6px;align-items:center}.tab,.ghost{border:1px solid transparent;border-radius:8px;padding:7px 10px;background:transparent;color:#ccc;cursor:pointer}
.tab.active{background:#183451;color:#dcecff;border-color:#244a70}.ghost{background:#222;border-color:var(--line)}
.period{font-size:12px;font-weight:650;min-width:160px;text-align:center}
.card{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.loading{font-size:12px;color:var(--muted);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:7px 12px;padding-top:12px;font-size:10px;color:#ccc}
.legend-item{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.lifetime-grid{display:grid;grid-template-columns:repeat(52,minmax(5px,1fr));gap:3px}
.life-cell,.day-cell{aspect-ratio:1;border:1px solid #454545;background:var(--empty);border-radius:2px;cursor:pointer}
.life-cell:hover,.day-cell:hover{outline:1px solid white;outline-offset:1px}.future{opacity:.35}
.year-grid{display:grid;grid-template-columns:repeat(31,minmax(9px,1fr));gap:4px}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{font-size:10px;color:var(--muted);text-align:center}
.month-cell{min-height:76px;border:1px solid var(--line);border-radius:8px;background:#222;padding:7px;cursor:pointer;position:relative}.month-cell.empty{visibility:hidden}
.date-num{font-size:11px;font-weight:700}.mood-chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:3px 6px;border-radius:999px;background:rgba(0,0,0,.3);font-size:9px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.diary-mark{position:absolute;right:6px;bottom:5px;font-size:10px;color:#bbb}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week-card{min-height:150px;border:1px solid var(--line);border-radius:10px;background:#222;padding:9px;cursor:pointer}
.week-date{font-size:10px;color:var(--muted)}.week-mood{font-size:11px;font-weight:700;margin-top:8px}.week-diary{font-size:11px;color:#ddd;line-height:1.35;margin-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-bg.open{display:flex}
.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#232323;border:1px solid #444;border-radius:14px;padding:16px}
.modal-head{display:flex;justify-content:space-between}.modal h2{font-size:17px;margin:0}.modal-date{font-size:11px;color:var(--muted);margin-top:4px}.close{border:0;background:none;color:#aaa;font-size:20px;cursor:pointer}
.label{font-size:11px;color:#ccc;margin:13px 0 6px}.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.mood-btn{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#1d1d1d;color:#eee;cursor:pointer;text-align:left;font-size:11px}.mood-btn.selected{border-color:white;background:#2a2a2a}
textarea{width:100%;min-height:130px;resize:vertical;background:#191919;color:#f5f5f5;border:1px solid #454545;border-radius:8px;padding:10px}
.actions{display:flex;justify-content:space-between;margin-top:14px}.primary,.delete{padding:8px 12px;border-radius:8px;cursor:pointer}.primary{background:#2f80ed;color:white;border:0}.delete{background:#2a1e1e;color:#ffb2b2;border:1px solid #653838}.status{font-size:10px;color:var(--muted);margin-top:8px;min-height:14px}.error{color:#ff9a9a}
@media(max-width:800px){body{padding:9px}.stats{display:none}.week-grid{grid-template-columns:1fr}.moods{grid-template-columns:1fr}.lifetime-grid{gap:2px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div><div class="eyebrow">Life in color</div><h1>Life Calendar</h1><div class="sub">Mood Tracker · Core Memory · Diary</div></div>
<div class="stats"><div class="stat"><b id="entryCount">0</b><span>Entries</span></div><div class="stat"><b id="streakCount">0</b><span>Day streak</span></div></div>
</header>
<div class="toolbar">
<div class="tabs"><button class="tab active" data-view="lifetime">Lifetime</button><button class="tab" data-view="year">Year</button><button class="tab" data-view="month">Month</button><button class="tab" data-view="week">Week</button></div>
<div class="nav"><button class="ghost" id="prev">‹</button><div class="period" id="period">Lifetime</div><button class="ghost" id="next">›</button><button class="ghost" id="today">Today</button></div>
</div>
<section class="card"><div class="loading" id="loading">Loading Notion entries…</div><div id="calendar"></div><div class="legend" id="legend"></div></section>
</div>

<div class="modal-bg" id="modalBg">
<div class="modal">
<div class="modal-head"><div><h2>Daily check-in</h2><div class="modal-date" id="modalDate"></div></div><button class="close" id="close">×</button></div>
<div class="label">Mood</div><div class="moods" id="moods"></div>
<div class="label">What happened today? (Diary)</div>
<textarea id="diary" placeholder="What happened, what did you think about, what do you want to remember?"></textarea>
<div class="status" id="status"></div>
<div class="actions"><button class="delete" id="clear">Clear day</button><button class="primary" id="save">Save to Notion</button></div>
</div></div>

<script>
const MOODS=[
{name:"Adventure / Excited",color:"#F0EA00"},{name:"Productive Day",color:"#1389E5"},
{name:"Happy & Sad",color:"#713DBD"},{name:"Mess Up",color:"#DC8669"},
{name:"Happy / Free",color:"#FB5593"},{name:"Sad",color:"#7F8989"},
{name:"Normal",color:"#8BD0E6"},{name:"Feel Loved",color:"#F7BEC3"},
{name:"Peaceful",color:"#D4EABC"},{name:"Fantastic Day",color:"#EC0060"},
{name:"Busy / A Lot on My Mind",color:"#13A5AD"},{name:"Colorful Day",color:"#FFD20A"},
{name:"Empty / Lost",color:"#DBD8DB"}];
const state={view:"lifetime",anchor:new Date(),config:null,entries:new Map(),modalDate:null,selectedMood:null};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)},add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sow=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x},eow=d=>add(sow(d),6);
const mood=n=>MOODS.find(x=>x.name===n),entry=d=>state.entries.get(iso(d)),future=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate())>new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
async function api(url,opt={}){const r=await fetch(url,{cache:"no-store",headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j}
function range(){const a=state.anchor;if(state.view==="lifetime"){const s=parse(state.config.birthDate),e=new Date(s);e.setFullYear(e.getFullYear()+state.config.lifespanYears);e.setDate(e.getDate()-1);return{start:s,end:e}}if(state.view==="year")return{start:new Date(a.getFullYear(),0,1),end:new Date(a.getFullYear(),11,31)};if(state.view==="month")return{start:new Date(a.getFullYear(),a.getMonth(),1),end:new Date(a.getFullYear(),a.getMonth()+1,0)};return{start:sow(a),end:eow(a)}}
async function load(){const r=range();$("loading").textContent="Loading Notion entries…";try{const j=await api(`/api/entries?from=${iso(r.start)}&to=${iso(r.end)}`);state.entries=new Map(j.entries.map(e=>[e.date,e]));$("entryCount").textContent=j.totalEntries??j.entries.length;$("streakCount").textContent=j.streak??0;$("loading").textContent="";render()}catch(e){$("loading").textContent=e.message;$("loading").className="loading error"}}
function legend(){$("legend").innerHTML=MOODS.map(m=>`<span class="legend-item"><span class="dot" style="background:${m.color}"></span>${m.name}</span>`).join("")}
function title(){const a=state.anchor;if(state.view==="lifetime")return`${state.config.lifespanYears} years · ${state.config.lifespanYears*52} weeks`;if(state.view==="year")return String(a.getFullYear());if(state.view==="month")return a.toLocaleDateString(undefined,{month:"long",year:"numeric"});const s=sow(a),e=eow(a);return`${s.toLocaleDateString(undefined,{day:"numeric",month:"short"})} – ${e.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}`}
function render(){$("period").textContent=title();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));legend();state.view==="lifetime"?renderLife():state.view==="year"?renderYear():state.view==="month"?renderMonth():renderWeek()}
function dominant(arr){const c={};arr.forEach(e=>{if(e.mood)c[e.mood]=(c[e.mood]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||null}
function renderLife(){const s=parse(state.config.birthDate),total=state.config.lifespanYears*52;let h='<div class="lifetime-grid">';for(let i=0;i<total;i++){const ws=add(s,i*7),we=add(ws,6),es=[];for(let d=ws;d<=we;d=add(d,1)){const e=entry(d);if(e)es.push(e)}const mn=dominant(es),m=mood(mn);h+=`<div class="life-cell${future(ws)?" future":""}" style="background:${m?m.color:"var(--empty)"}" title="Week ${i+1}${mn?` · ${mn}`:""}" data-week="${iso(ws)}"></div>`}h+="</div>";$("calendar").innerHTML=h;document.querySelectorAll("[data-week]").forEach(c=>c.onclick=()=>{state.view="week";state.anchor=parse(c.dataset.week);load()})}
function renderYear(){let d=new Date(state.anchor.getFullYear(),0,1),e=new Date(state.anchor.getFullYear(),11,31),h='<div class="year-grid">';while(d<=e){const x=entry(d),m=mood(x?.mood);h+=`<div class="day-cell${future(d)?" future":""}" style="background:${m?m.color:"var(--empty)"}" data-date="${iso(d)}" title="${iso(d)}${x?.mood?` · ${x.mood}`:""}"></div>`;d=add(d,1)}$("calendar").innerHTML=h+"</div>";bind()}
function renderMonth(){const y=state.anchor.getFullYear(),mo=state.anchor.getMonth(),first=new Date(y,mo,1),last=new Date(y,mo+1,0),blank=(first.getDay()+6)%7;let h='<div class="month-grid">';["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(x=>h+=`<div class="weekday">${x}</div>`);for(let i=0;i<blank;i++)h+='<div class="month-cell empty"></div>';for(let n=1;n<=last.getDate();n++){const d=new Date(y,mo,n),x=entry(d),m=mood(x?.mood);h+=`<div class="month-cell" data-date="${iso(d)}" style="${m?`background:${m.color}30;border-color:${m.color}88`:""}"><div class="date-num">${n}</div>${m?`<div class="mood-chip"><span class="dot" style="background:${m.color}"></span>${m.name}</div>`:""}${x?.diary?'<div class="diary-mark">• diary</div>':""}</div>`}$("calendar").innerHTML=h+"</div>";bind()}
function renderWeek(){const s=sow(state.anchor);let h='<div class="week-grid">';for(let i=0;i<7;i++){const d=add(s,i),x=entry(d),m=mood(x?.mood);h+=`<div class="week-card" data-date="${iso(d)}" style="${m?`border-top:4px solid ${m.color}`:""}"><div class="week-date">${d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}</div><div class="date-num">${iso(d)}</div><div class="week-mood">${m?`<span class="dot" style="background:${m.color};margin-right:6px"></span>${m.name}`:"No mood"}</div><div class="week-diary">${x?.diary||"Click to add diary"}</div></div>`}$("calendar").innerHTML=h+"</div>";bind()}
function bind(){document.querySelectorAll("[data-date]").forEach(c=>c.onclick=()=>openModal(c.dataset.date))}
function renderMoods(){$("moods").innerHTML=MOODS.map(m=>`<button class="mood-btn${state.selectedMood===m.name?" selected":""}" data-m="${m.name}"><span class="dot" style="background:${m.color}"></span>${m.name}</button>`).join("");document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.selectedMood=b.dataset.m;renderMoods()})}
function openModal(date){state.modalDate=date;const x=state.entries.get(date);state.selectedMood=x?.mood||null;$("modalDate").textContent=parse(date).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});$("diary").value=x?.diary||"";$("status").textContent="";renderMoods();$("modalBg").classList.add("open")}
function closeModal(){$("modalBg").classList.remove("open")}$("close").onclick=closeModal;$("modalBg").onclick=e=>{if(e.target===$("modalBg"))closeModal()}
$("save").onclick=async()=>{try{$("status").textContent="Saving…";await api("/api/entry",{method:"POST",body:JSON.stringify({date:state.modalDate,mood:state.selectedMood,diary:$("diary").value.trim()})});$("status").textContent="Saved to Notion";await load();setTimeout(closeModal,250)}catch(e){$("status").textContent=e.message;$("status").className="status error"}}
$("clear").onclick=async()=>{try{await api("/api/entry",{method:"POST",body:JSON.stringify({date:state.modalDate,mood:null,diary:""})});await load();closeModal()}catch(e){$("status").textContent=e.message}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;load()});$("today").onclick=()=>{state.anchor=new Date();load()};$("prev").onclick=()=>{state.anchor=state.view==="year"?new Date(state.anchor.getFullYear()-1,0,1):state.view==="month"?new Date(state.anchor.getFullYear(),state.anchor.getMonth()-1,1):add(state.anchor,-7);load()};$("next").onclick=()=>{state.anchor=state.view==="year"?new Date(state.anchor.getFullYear()+1,0,1):state.view==="month"?new Date(state.anchor.getFullYear(),state.anchor.getMonth()+1,1):add(state.anchor,7);load()};
(async()=>{try{state.config=await api("/api/config");await load()}catch(e){$("loading").textContent=e.message;$("loading").className="loading error"}})();
</script>
</body></html>
